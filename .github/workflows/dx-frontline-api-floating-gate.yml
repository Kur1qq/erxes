name: DX Frontline API Promise gate experiment (fork)

on:
  pull_request:
    branches:
      - feat/dx-frontline-api-floating-pilot
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: read

jobs:
  frontline-api-floating-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify shared Git diff parser
        run: node --test scripts/__tests__/git-diff-lines.test.mjs

      - name: Verify new-any gate self-test
        run: node scripts/check-new-any.mjs --self-test

      - name: Report all Frontline API floating Promises
        run: node scripts/report-frontline-api-floating-promises.mjs --report "$RUNNER_TEMP/frontline-api-floating-promises.json"

      - name: Upload finding locations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontline-api-floating-promises-gate
          path: ${{ runner.temp }}/frontline-api-floating-promises.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify changed-line gate parser
        run: node scripts/check-new-floating-promises.mjs --self-test

      - name: Reject floating Promises on changed Frontline API lines
        env:
          DX_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/check-new-floating-promises.mjs "$DX_BASE_SHA" "$RUNNER_TEMP/frontline-api-floating-promises.json"
