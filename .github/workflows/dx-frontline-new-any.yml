name: DX experiment - frontline new any

on:
  push:
    branches:
      - feat/dx-new-any-gate

permissions:
  contents: read

jobs:
  new-explicit-any:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify new-any gate
        run: node scripts/check-new-any.mjs --self-test

      - name: Check changed frontline UI lines
        run: node scripts/check-new-any.mjs 824d94024541109321f8bf43ef2e8c274458b2b5
